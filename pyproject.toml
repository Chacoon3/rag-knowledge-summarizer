[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-kb"
version = "0.1.0"
description = "Local RAG knowledge base with document ingestion, vector retrieval, and optional Ollama generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.23",
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.1",
    "python-multipart>=0.0.12",
    "python-docx>=1.1",
    "sentence-transformers>=3.3",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
local-rag = "local_rag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_rag = ["web/index.html", "web/assets/*.css", "web/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
